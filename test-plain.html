<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/wavesurfer.js@7.8.2"></script>
<script src="https://unpkg.com/wavesurfer.js@7.8.2/dist/plugins/record.min.js"></script>
</head>
<body>
<button id="start">Start</button>
<button id="stop">Stop</button>
<script defer type="module">
const wavesurfer = WaveSurfer.create({
    container: document.body,
    waveColor: 'violet',
    progressColor: 'purple'
});

const record = wavesurfer.registerPlugin(WaveSurfer.Record.create({
    scrollingWaveform: true,
    renderRecordedAudio: false
}));

record.on('record-data-available', (blob) => {
    console.log('test data available', blob);
});

record.on('record-progress', (time) => {
    // console.log('progress');
});

document.getElementById('start').onclick = () => {
    record.startRecording();
};
document.getElementById('stop').onclick = () => {
    record.stopRecording();
};
</script>
</body>
</html>
